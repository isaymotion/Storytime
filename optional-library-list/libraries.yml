name: Update library list
# Rebuilds data/libraries.json, which powers "Find your library" in the app.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'   # Mondays 03:17 UTC
permissions:
  contents: write
concurrency:
  group: libraries
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/build-libraries.mjs
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain data/libraries.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/libraries.json
            git commit -m "Update library list"
            git push
          else
            echo "No change."
          fi
